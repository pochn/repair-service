<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repair Assistant</title>
<style>
  :root{--ink:#102033;--muted:#64748b;--blue:#2563eb;--blue-dark:#1d4ed8;--soft:#eff6ff;--line:#dbe4ef;--danger:#dc2626;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;color:var(--ink);background:linear-gradient(180deg,#0f1d38 0 190px,#eef3f9 190px 100%)}
  .header{max-width:720px;margin:auto;padding:28px 20px 42px;color:white}
  .eyebrow{color:#93c5fd;font-size:12px;font-weight:700;letter-spacing:.08em}
  h1{margin:6px 0 0;font-size:28px}
  .wrap{max-width:720px;margin:-20px auto 40px;padding:0 16px}
  .panel{background:white;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 24px #10203312}
  h2{margin:0;font-size:20px}.sub{margin:5px 0 18px;color:var(--muted);font-size:14px}
  .voice{display:grid;place-items:center;background:var(--soft);border:1px solid #bfdbfe;border-radius:14px;padding:18px;margin-bottom:18px;text-align:center}
  #voiceBtn{width:78px;height:78px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:31px;cursor:pointer;box-shadow:0 8px 18px #2563eb40}
  #voiceBtn.listening{background:var(--danger);animation:pulse 1.2s infinite}
  #voiceBtn:disabled{opacity:.5;cursor:not-allowed}
  #voiceStatus{margin-top:10px;color:var(--muted);font-weight:700;font-size:14px}
  #preview{width:100%;min-height:24px;margin-top:8px;text-align:left;font-size:14px;word-break:break-word}
  @keyframes pulse{50%{box-shadow:0 0 0 12px #dc262600}}
  .field{margin-bottom:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px;font-weight:700}
  input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink)}
  input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 3px #bfdbfe}
  .save{width:100%;padding:13px;border:0;border-radius:11px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}.save:hover{background:var(--blue-dark)}
  .save:disabled{opacity:.6;cursor:wait}.hint{margin:14px 0 0;color:var(--muted);font-size:12px;text-align:center}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#102033;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:560px){.row{grid-template-columns:1fr 1fr}.panel{padding:18px}}
</style>
</head>
<body>
<header class="header"><div class="eyebrow">CHIANG MAI · LAPTOP &amp; PC SERVICE</div><h1>🔧 Repair Assistant</h1></header>
<main class="wrap"><section class="panel">
  <h2>เพิ่มนัดหมายใหม่</h2>
  <p class="sub">พูดภาษาไทยหรือกรอกข้อมูลด้วยตัวเอง</p>
  <div class="voice">
    <button id="voiceBtn" type="button" aria-label="เริ่มพูดนัดหมาย">🎙️</button>
    <div id="voiceStatus">แตะเพื่อพูดบันทึกนัดหมาย</div>
    <div id="preview" aria-live="polite"></div>
  </div>
  <div class="field"><label for="name">ชื่อลูกค้า</label><input id="name" placeholder="เช่น คุณสมชาย"></div>
  <div class="row">
    <div class="field"><label for="phone">เบอร์โทร</label><input id="phone" placeholder="08x-xxx-xxxx" inputmode="tel"></div>
    <div class="field"><label for="date">วันที่</label><input id="date" type="date"></div>
  </div>
  <div class="row">
    <div class="field"><label for="time">เวลา</label><input id="time" placeholder="เช่น 14:00" inputmode="numeric"></div>
    <div class="field"><label for="job">งาน</label><input id="job" placeholder="เช่น เปลี่ยนจอ"></div>
  </div>
  <div class="field"><label for="note">หมายเหตุ</label><input id="note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></div>
  <button class="save" id="saveBtn" type="button">💾 บันทึกนัดหมาย</button>
  <p class="hint">หน้านี้ใช้ไมโครโฟนของเบราว์เซอร์โดยตรง และบันทึกข้อมูลลง Google Sheet</p>
</section></main>
<div id="toast"></div><iframe name="saveTarget" id="saveTarget" hidden></iframe>
<script>
const GAS_ENDPOINT='https://script.google.com/macros/s/AKfycbwp3NYz2WONBWBmtZoKT3hizu_hsqPik6_pYdKAfRoTP2NAJLq73tr2whgqGLPrLXSg/exec';
let recognition=null, finalText='';
const $=id=>document.getElementById(id);
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3000)}
function dateString(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')}
function phoneFrom(text){const m=text.match(/(?:เบอร์โทร|เบอร์|โทรศัพท์)\s*[:：]?\s*([0-9๐-๙][0-9๐-๙\-\s]{8,}[0-9๐-๙])/i);if(!m)return'';return m[1].replace(/[๐-๙]/g,d=>'๐๑๒๓๔๕๖๗๘๙'.indexOf(d)).replace(/[\s-]/g,'')}
function timeFrom(text){const direct=text.match(/(?:เวลา\s*)?([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)/i);if(direct)return String(direct[1]).padStart(2,'0')+':'+direct[2];const map={'บ่ายโมง':13,'บ่ายสอง':14,'บ่ายสาม':15,'สี่โมงเย็น':16,'ห้าโมงเย็น':17,'หกโมงเย็น':18,'เก้าโมงเช้า':9,'สิบโมงเช้า':10,'สิบเอ็ดโมงเช้า':11,'เที่ยง':12};for(const key in map)if(text.includes(key))return String(map[key]).padStart(2,'0')+':00';const h=text.match(/(\d{1,2})\s*โมง/);return h?String(parseInt(h[1],10)+(text.includes('บ่าย')?12:0)).padStart(2,'0')+':00':''}
function dateFrom(text){const now=new Date();if(text.includes('พรุ่งนี้')){now.setDate(now.getDate()+1);return dateString(now)}if(text.includes('วันนี้'))return dateString(now);const months={'มกราคม':1,'กุมภาพันธ์':2,'มีนาคม':3,'เมษายน':4,'พฤษภาคม':5,'มิถุนายน':6,'กรกฎาคม':7,'สิงหาคม':8,'กันยายน':9,'ตุลาคม':10,'พฤศจิกายน':11,'ธันวาคม':12};const m=text.match(new RegExp('(\\d{1,2})\\s*(?:เดือน)?\\s*('+Object.keys(months).join('|')+')(?:\\s*(?:ปี)?\\s*(\\d{2,4}))?'));if(!m)return'';let year=m[3]?parseInt(m[3],10):now.getFullYear();if(year<100)year+=2500;if(year>=2400)year-=543;return year+'-'+String(months[m[2]]).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
function fillFromVoice(text){const n=text.match(/(?:ชื่อลูกค้า|ลูกค้า|นัดคุณ|นัด)\s*([^,\n]+?)(?=\s*(?:เบอร์|โทรศัพท์|วันที่|วันพรุ่งนี้|พรุ่งนี้|เวลา|งาน|อาการ|ทำ|ซ่อม|เปลี่ยน|หมายเหตุ|$))/i);if(n)$('name').value=n[1].trim();const phone=phoneFrom(text),date=dateFrom(text),time=timeFrom(text);if(phone)$('phone').value=phone;if(date)$('date').value=date;if(time)$('time').value=time;const job=text.match(/(?:อาการ|งาน|ทำ|ซ่อม|เปลี่ยน)\s*([^,\n]+?)(?=\s*(?:หมายเหตุ|$))/i);if(job)$('job').value=job[1].trim();const note=text.match(/หมายเหตุ\s*(.+)$/i);if(note)$('note').value=note[1].trim()}
function setupVoice(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){$('voiceBtn').disabled=true;$('voiceStatus').textContent='เบราว์เซอร์นี้ไม่รองรับ Speech Recognition';return}recognition=new Recognition();recognition.lang='th-TH';recognition.continuous=true;recognition.interimResults=true;recognition.onstart=()=>{$('voiceBtn').classList.add('listening');$('voiceStatus').textContent='🔴 กำลังฟัง... พูดได้เลย';finalText=''};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}$('preview').textContent=(finalText+interim).trim();fillFromVoice((finalText+interim).trim())};recognition.onerror=e=>{$('voiceBtn').classList.remove('listening');$('voiceStatus').textContent=e.error==='not-allowed'?'เบราว์เซอร์ไม่อนุญาตไมโครโฟน':'ฟังเสียงไม่สำเร็จ ลองใหม่อีกครั้ง'};recognition.onend=()=>{$('voiceBtn').classList.remove('listening');if($('voiceStatus').textContent.includes('กำลังฟัง'))$('voiceStatus').textContent='แตะเพื่อพูดบันทึกนัดหมาย'};$('voiceBtn').onclick=()=>{if($('voiceBtn').classList.contains('listening'))recognition.stop();else{try{recognition.start()}catch(e){}}}}
function save(){const data={name:$('name').value.trim(),phone:$('phone').value.trim(),date:$('date').value,time:$('time').value.trim(),job:$('job').value.trim(),note:$('note').value.trim()};if(!data.name||!data.date||!data.time){toast('กรุณากรอกชื่อ วันที่ และเวลาให้ครบ');return}const button=$('saveBtn');button.disabled=true;button.textContent='กำลังบันทึก...';const query=new URLSearchParams(data).toString();$('saveTarget').onload=()=>{button.disabled=false;button.textContent='💾 บันทึกนัดหมาย';toast('บันทึกนัดหมายเรียบร้อยแล้ว ✅');['name','phone','date','time','job','note'].forEach(id=>$(id).value='');$('preview').textContent=''};$('saveTarget').src=GAS_ENDPOINT+'?'+query}
$('saveBtn').onclick=save;setupVoice();
</script></body></html>
