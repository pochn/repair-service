<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repair Assistant</title>
  <style>
    :root {
      --ink: #102033;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --soft: #eff6ff;
      --line: #dbe4ef;
      --danger: #dc2626;
      --success: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #0f1d38 0 190px, #eef3f9 190px 100%);
    }
    .header { max-width: 720px; margin: auto; padding: 28px 20px 42px; color: white; }
    .eyebrow { color: #93c5fd; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 6px 0 0; font-size: 28px; }
    .wrap { max-width: 720px; margin: -20px auto 40px; padding: 0 16px; }
    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 24px #10203312;
    }
    h2 { margin: 0; font-size: 20px; }
    .sub { margin: 5px 0 18px; color: var(--muted); font-size: 14px; }
    
    /* Quick Voice / Keyboard Box */
    .quick-box {
      background: #f8fafc;
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .quick-box label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--blue-dark);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .quick-box textarea {
      width: 100%;
      height: 64px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      resize: none;
    }
    .quick-box textarea:focus { outline: none; border-color: var(--blue); }

    .voice {
      display: grid;
      place-items: center;
      background: var(--soft);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      text-align: center;
    }
    #voiceBtn {
      width: 70px;
      height: 70px;
      border: 0;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 8px 18px #2563eb40;
    }
    #voiceBtn.listening { background: var(--danger); animation: pulse 1.2s infinite; }
    #voiceStatus { margin-top: 8px; color: var(--muted); font-weight: 700; font-size: 13px; }
    #preview { width: 100%; min-height: 20px; margin-top: 6px; text-align: left; font-size: 13px; word-break: break-word; color: #1e293b; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 12px #dc262600; } }

    .field { margin-bottom: 13px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 13px; font-weight: 700; }
    input { width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 10px; font: inherit; color: var(--ink); }
    input:focus { outline: 0; border-color: var(--blue); box-shadow: 0 0 0 3px #bfdbfe; }
    
    .save {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .save:hover { background: var(--blue-dark); }
    .save:disabled { opacity: .6; cursor: wait; }

    .appointments { margin-top: 16px; }
    .appointment-list { display: grid; gap: 8px; margin-top: 8px; }
    .appointment-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .appointment-main {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }
    .appointment-time {
      background: #dbeafe;
      border-radius: 7px;
      color: var(--blue-dark);
      font-size: 13px;
      font-weight: 800;
      padding: 6px 4px;
      text-align: center;
    }
    .appointment-info { min-width: 0; }
    .appointment-top { display: flex; align-items: center; gap: 6px; font-size: 14px; }
    .appointment-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .appointment-phone { color: var(--muted); font-size: 12px; font-weight: 500; }
    .appointment-meta { margin-top: 2px; color: #475569; font-size: 12px; }
    .appointment-note { color: #94a3b8; font-style: italic; }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px dashed #edf2f7;
      flex-wrap: wrap;
    }
    .btn-act {
      border: 0;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }
    .btn-call { background: #dcfce7; color: #047857; }
    .btn-finish { background: #e0f2fe; color: #0369a1; }
    .btn-reschedule { background: #fef3c7; color: #b45309; }
    .btn-del { background: #fee2e2; color: #b91c1c; }

    .form-title { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
    .current-datetime { color: var(--muted); font-size: 1.15rem; font-weight: 700; }
    #toast {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
      background: #102033; color: #fff; padding: 12px 16px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: .2s; max-width: 90%; text-align: center; z-index: 99;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 560px) {
      .header-title { align-items: start; }
      .current-datetime { font-size: .85rem; text-align: right; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="eyebrow">CHIANG MAI · LAPTOP &amp; PC SERVICE</div>
    <div class="header-title">
      <h1>🔧 Repair Assistant</h1>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="form-title">
        <h2>เพิ่มนัดหมายใหม่</h2>
        <div class="current-datetime" id="currentDateTime">กำลังโหลดวันเวลา...</div>
      </div>
      <p class="sub">พูดผ่านไมค์คีย์บอร์ดมือถือ หรือใช้ไมค์หน้าเว็บ</p>

      <!-- Quick Input สำหรับไมค์แป้นพิมพ์มือถือ -->
      <div class="quick-box">
        <label for="quickInput">📱 พูดผ่านแป้นพิมพ์มือถือ (กดไมค์ที่คีย์บอร์ดพูดรวดเดียว):</label>
        <textarea id="quickInput" placeholder="แตะที่นี่แล้วกดรูปไมค์ที่คีย์บอร์ด เช่น: คุณสมชาย 0812345678 พรุ่งนี้บ่ายสอง เปลี่ยนแบตเตอรี่"></textarea>
      </div>

      <div class="voice">
        <button id="voiceBtn" type="button" aria-label="เริ่มพูดนัดหมาย">🎙️</button>
        <div id="voiceStatus">แตะเพื่อพูดบันทึกนัดหมาย (สำหรับคอมพิวเตอร์)</div>
        <div id="preview"></div>
      </div>

      <div class="field">
        <label for="name">ชื่อลูกค้า</label>
        <input id="name" placeholder="เช่น คุณสมชาย">
      </div>

      <div class="row">
        <div class="field">
          <label for="phone">เบอร์โทร</label>
          <input id="phone" placeholder="08x-xxx-xxxx" inputmode="tel">
        </div>
        <div class="field">
          <label for="date">วันที่</label>
          <input id="date" placeholder="เช่น 08/09/2569 หรือ 2026-09-08" inputmode="numeric">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="time">เวลา</label>
          <input id="time" placeholder="เช่น 14:00" inputmode="numeric">
        </div>
        <div class="field">
          <label for="job">งาน</label>
          <input id="job" placeholder="เช่น เปลี่ยนจอ">
        </div>
      </div>

      <div class="field">
        <label for="note">หมายเหตุ</label>
        <input id="note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)">
      </div>

      <button class="save" id="saveBtn" type="button">💾 บันทึกนัดหมาย</button>
    </section>

    <section class="panel appointments">
      <h2>รายการนัดหมาย</h2>
      <p class="sub">นัดวันนี้และพรุ่งนี้</p>
      <div class="appointment-list" id="appointmentList">
        <div class="summary-date">กำลังโหลดรายการ...</div>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <iframe name="saveTarget" id="saveTarget" hidden></iframe>

  <script>
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwp3NYz2WONBWBmtZoKT3hizu_hsqPik6_pYdKAfRoTP2NAJLq73tr2whgqGLPrLXSg/exec';
    let recognition = null, speechTimeout = null;
    const $ = id => document.getElementById(id);

    function toast(message) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 3000);
    }

    function dateString(date) {
      return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    }

    function phoneFrom(text) {
      const m = text.match(/(?:เบอร์โทร|เบอร์|โทรศัพท์)\s*[:：]?\s*([0-9๐-๙][0-9๐-๙\-\s]{8,}[0-9๐-๙])/i);
      if (!m) return '';
      return m[1].replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d)).replace(/[\s-]/g, '');
    }

    function timeFrom(text) {
      const direct = text.match(/(?:เวลา\s*)?([01]?\d|2[0-3])\s*[:.]\s*([0-5]\d)/i);
      if (direct) return String(direct[1]).padStart(2, '0') + ':' + direct[2];
      const map = { 'บ่ายโมง': 13, 'บ่ายสอง': 14, 'บ่ายสาม': 15, 'สี่โมงเย็น': 16, 'ห้าโมงเย็น': 17, 'หกโมงเย็น': 18, 'เก้าโมงเช้า': 9, 'สิบโมงเช้า': 10, 'สิบเอ็ดโมงเช้า': 11, 'เที่ยง': 12 };
      for (const key in map) if (text.includes(key)) return String(map[key]).padStart(2, '0') + ':00';
      const h = text.match(/(\d{1,2})\s*โมง/);
      return h ? String(parseInt(h[1], 10) + (text.includes('บ่าย') ? 12 : 0)).padStart(2, '0') + ':00' : '';
    }

    function toGregorianYear(year) {
      let v = Number(year);
      if (v < 100) v += 2500;
      if (v >= 2400) v -= 543;
      return v;
    }

    function relativeDays(text) {
      const words = { 'หนึ่ง': 1, 'สอง': 2, 'สาม': 3, 'สี่': 4, 'ห้า': 5 };
      const match = text.match(/อีก\s*(\d+|หนึ่ง|สอง|สาม|สี่|ห้า)\s*วัน/i);
      return match ? (words[match[1]] || Number(match[1])) : 0;
    }

    function normalizeThaiWords(text) {
      let val = String(text || '');
      const words = { 'ศูนย์': '0', 'หนึ่ง': '1', 'สอง': '2', 'สาม': '3', 'สี่': '4', 'ห้า': '5', 'หก': '6', 'เจ็ด': '7', 'แปด': '8', 'เก้า': '9' };
      Object.keys(words).forEach(w => { val = val.split(w).join(words[w]); });
      return val.replace(/[๐-๙]/g, d => '๐๑๒๓๔๕๖๗๘๙'.indexOf(d));
    }

    function parseAppointmentDate(value) {
      const source = normalizeThaiWords(String(value || '').replace(/\s+/g, ' ').trim());
      const now = new Date();
      const days = relativeDays(source);
      if (days) { now.setDate(now.getDate() + days); return dateString(now); }
      if (source.includes('พรุ่งนี้')) { now.setDate(now.getDate() + 1); return dateString(now); }
      if (source.includes('วันนี้')) return dateString(now);

      const m = source.match(/(?:วันที่\s*)?(\d{1,2})\s*(?:เดือน|[\/-])\s*(\d{1,2})(?:\s*(?:ปี)?\s*(\d{2,4}))?/i);
      if (m && Number(m[1]) <= 31 && Number(m[2]) <= 12) {
        return toGregorianYear(m[3] || now.getFullYear()) + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
      }
      return '';
    }

    function fillFromVoice(text) {
      const named = text.match(/((?:คุณ|พี่|ช่าง|น้อง)\s*[^,\s]+?)(?=\s*(?:เบอร์|โทรศัพท์|วันที่|วันพรุ่งนี้|พรุ่งนี้|เวลา|งาน|อาการ|ทำ|ซ่อม|เปลี่ยน|หมายเหตุ|$))/i);
      const fallback = text.match(/(?:ชื่อลูกค้า|ลูกค้า|นัดคุณ|นัด)\s*([^,\n]+?)(?=\s*(?:เบอร์|โทรศัพท์|วันที่|วันพรุ่งนี้|พรุ่งนี้|เวลา|งาน|อาการ|ทำ|ซ่อม|เปลี่ยน|หมายเหตุ|$))/i);
      if (named) $('name').value = named[1].trim();
      else if (fallback) $('name').value = fallback[1].trim();

      const phone = phoneFrom(text), date = parseAppointmentDate(text), time = timeFrom(text);
      if (phone) $('phone').value = phone;
      if (date) $('date').value = date;
      if (time) $('time').value = time;

      const job = text.match(/(?:อาการ|งาน|ทำ|ซ่อม|เปลี่ยน)\s*([^,\n]+?)(?=\s*(?:หมายเหตุ|วันที่|เวลา|เบอร์|$))/i);
      if (job) $('job').value = job[1].trim();

      const noteMatch = text.match(/หมายเหตุ\s*([^,\n]+?)(?=\s*(?:วันที่|เวลา|เบอร์|$))/i);
      if (noteMatch) $('note').value = noteMatch[1].trim();
    }

    // เมื่อพิมพ์หรือพูดลงในช่อง Quick Input
    $('quickInput').addEventListener('input', (e) => {
      const text = e.target.value;
      if (text.trim()) fillFromVoice(text);
    });

    function setupVoice() {
      const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!Recognition) return;
      recognition = new Recognition();
      recognition.lang = 'th-TH';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        $('voiceBtn').classList.add('listening');
        $('voiceStatus').textContent = '🔴 กำลังฟัง... พูดได้เลยครับ';
      };
      recognition.onresult = e => {
        clearTimeout(speechTimeout);
        let full = '';
        for (let i = 0; i < e.results.length; i++) full += e.results[i][0].transcript;
        $('preview').textContent = full;
        fillFromVoice(full);
        speechTimeout = setTimeout(() => { if ($('voiceBtn').classList.contains('listening')) recognition.stop(); }, 2500);
      };
      recognition.onend = () => {
        $('voiceBtn').classList.remove('listening');
        $('voiceStatus').textContent = 'แตะเพื่อพูดบันทึกนัดหมาย (สำหรับคอมพิวเตอร์)';
      };
      $('voiceBtn').onclick = () => {
        if ($('voiceBtn').classList.contains('listening')) recognition.stop();
        else recognition.start();
      };
    }

    // จัดการ Action นัดหมาย (เลื่อนวัน, เสร็จงาน, ลบ)
    function executeAction(action, rowIndex, extraParam = '') {
      toast('กำลังดำเนินการ...');
      let url = GAS_ENDPOINT + '?action=' + action + '&rowIndex=' + rowIndex + extraParam;
      $('saveTarget').onload = () => {
        toast('ดำเนินการสำเร็จ ✅');
        loadSummary();
      };
      $('saveTarget').src = url;
    }

    function confirmDelete(rowIndex, name) {
      if (confirm(`ยืนยันการลบนัดหมายของ "${name}" ใช่หรือไม่?`)) {
        executeAction('delete', rowIndex);
      }
    }

    function promptReschedule(rowIndex, name) {
      const days = prompt(`ต้องการเลื่อนนัดของ "${name}" ออกไปกี่วัน? (พิมพ์ตัวเลข เช่น 1, 2, 3)`, "1");
      if (days && !isNaN(days)) {
        executeAction('reschedule', rowIndex, '&days=' + days);
      }
    }

    function renderAppointments(items, todayKey, tomorrowKey) {
      const list = $('appointmentList');
      const todayItems = (items || []).filter(item => item.date === todayKey);
      const tomorrowItems = (items || []).filter(item => item.date === tomorrowKey);

      function cards(entries) {
        if (!entries.length) return '<div class="appointment-group empty">✅ ยังไม่มีนัดหมาย</div>';
        return entries.map(item => `
          <div class="appointment-item">
            <div class="appointment-main">
              <div class="appointment-time">${item.time}</div>
              <div class="appointment-info">
                <div class="appointment-top">
                  <strong class="appointment-name">${item.name}</strong>
                  <span class="appointment-phone">📞 ${item.phone}</span>
                </div>
                <div class="appointment-meta">🔧 ${item.job} ${item.note ? '<span class="appointment-note">· ' + item.note + '</span>' : ''}</div>
              </div>
              <a class="btn-act btn-call" href="tel:${item.phone}">📞 โทร</a>
            </div>
            <div class="actions-bar">
              <button class="btn-act btn-finish" onclick="executeAction('updateStatus', ${item.rowIndex}, '&status=เสร็จสิ้น')">✅ เสร็จงาน</button>
              <button class="btn-act btn-reschedule" onclick="promptReschedule(${item.rowIndex}, '${item.name}')">⏩ เลื่อนนัด</button>
              <button class="btn-act btn-del" onclick="confirmDelete(${item.rowIndex}, '${item.name}')">🗑️ ลบ</button>
            </div>
          </div>
        `).join('');
      }

      list.innerHTML = `
        <div class="appointment-group">
          <h3>📅 นัดหมายวันนี้ <span class="appointment-badge">${todayItems.length} งาน</span></h3>
          <div class="appointment-list">${cards(todayItems)}</div>
        </div>
        <div class="appointment-group tomorrow" style="margin-top:16px;">
          <h3>📅 นัดหมายพรุ่งนี้ <span class="appointment-badge">${tomorrowItems.length} งาน</span></h3>
          <div class="appointment-list">${cards(tomorrowItems)}</div>
        </div>
      `;
    }

    function loadSummary() {
      const callback = 'appointmentSummary_' + Date.now();
      const script = document.createElement('script');
      window[callback] = function(data) {
        renderAppointments(data.appointments, data.date, data.tomorrowDate);
        script.remove();
        delete window[callback];
      };
      script.src = GAS_ENDPOINT + '?action=summary&callback=' + callback;
      document.body.appendChild(script);
    }

    function save() {
      const data = {
        name: $('name').value.trim(),
        phone: $('phone').value.trim(),
        date: parseAppointmentDate($('date').value),
        time: $('time').value.trim(),
        job: $('job').value.trim(),
        note: $('note').value.trim()
      };

      if (!data.name || !data.date || !data.time) {
        toast('กรุณากรอกชื่อ วันที่ และเวลาให้ครบ');
        return;
      }

      const button = $('saveBtn');
      button.disabled = true;
      button.textContent = 'กำลังบันทึก...';

      const query = new URLSearchParams(data).toString();
      $('saveTarget').onload = () => {
        button.disabled = false;
        button.textContent = '💾 บันทึกนัดหมาย';
        toast('บันทึกเรียบร้อยแล้ว ✅');
        ['name', 'phone', 'date', 'time', 'job', 'note', 'quickInput'].forEach(id => $(id).value = '');
        loadSummary();
      };
      $('saveTarget').src = GAS_ENDPOINT + '?' + query;
    }

    function updateCurrentDateTime() {
      const now = new Date();
      $('currentDateTime').textContent = '📅 ' + now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' }) + ' | 🕒 ' + now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' น.';
    }

    $('saveBtn').onclick = save;
    setupVoice();
    loadSummary();
    updateCurrentDateTime();
    setInterval(updateCurrentDateTime, 1000);
  </script>
</body>
</html>
