<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามงานซ่อม</title>
<script src="[https://cdn.tailwindcss.com/3.4.17](https://cdn.tailwindcss.com/3.4.17)"></script>
<link href="[https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap](https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap)" rel="stylesheet">
<style>
  *{font-family:'Sarabun',sans-serif}
  .fade-in{animation:fadeIn .35s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .shake{animation:shake .4s ease-out}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    15%{transform:translateX(-6px)}
    30%{transform:translateX(6px)}
    45%{transform:translateX(-4px)}
    60%{transform:translateX(4px)}
    75%{transform:translateX(-2px)}
    90%{transform:translateX(2px)}
  }
</style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">

<header class="bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-lg mx-auto px-4 py-4 flex items-center gap-3">
    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-xl">🔧</div>
    <div>
      <div class="font-bold text-blue-700 text-base leading-none">ติดตามงานซ่อม</div>
      <div class="text-xs text-gray-400 mt-0.5">Track Repair Status</div>
    </div>
  </div>
</header>

<div class="max-w-lg mx-auto px-4 py-8">
  <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-5">
    <div class="text-center mb-5">
      <div class="text-4xl mb-2">🔍</div>
      <div class="font-bold text-gray-800 text-lg">ค้นหาสถานะการซ่อม</div>
      <div class="text-sm text-gray-400 mt-1">กรอก <strong class="text-gray-600">เบอร์โทร 10 หลัก</strong> หรือ <strong class="text-gray-600">รหัสงาน บนใบรับซ่อม</strong></div>
    </div>
    <div class="space-y-3" id="searchBox">
      <input id="searchInput" type="text" maxlength="15"
        placeholder="เช่น 0812345678 หรือ Job1"
        class="w-full px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-100 text-center text-base"
        onkeypress="if(event.key==='Enter')doSearch()" oninput="filterHistory(this.value)">
      <div id="historyBox" class="hidden space-y-1"></div>
      <button onclick="doSearch()" id="searchBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white py-3 rounded-xl font-bold text-sm transition-colors">
        🔍 ค้นหา
      </button>
      <div id="rateLimitBox" class="hidden text-center text-xs text-orange-600 bg-orange-50 border border-orange-200 rounded-xl py-2 px-3">
        ⏳ กรุณารอ <span id="countdownSec" class="font-bold">5</span> วินาที ก่อนค้นหาอีกครั้ง
      </div>
    </div>
  </div>

  <div id="resultArea"></div>

  <div id="loadingArea" class="hidden text-center py-8">
    <div class="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-3"></div>
    <div class="text-sm text-gray-400">กำลังค้นหา...</div>
  </div>

  <div class="text-center mt-8 text-xs text-gray-400 space-y-1">
    <div>มีปัญหาหรือต้องการสอบถาม</div>
    <div class="font-medium text-gray-500">📞 063-594-2636</div>
  </div>
</div>

<script>
const API_URL = '[https://script.google.com/macros/s/AKfycbysbzklPFBvkF3mL4MSBHS5_g7McNjKwbxhtp7UFH_1uJ3c_lIZGSXYk8M2fmR5v7UN/exec](https://script.google.com/macros/s/AKfycbysbzklPFBvkF3mL4MSBHS5_g7McNjKwbxhtp7UFH_1uJ3c_lIZGSXYk8M2fmR5v7UN/exec)';
const RATE_LIMIT_MS = 5 * 1000;
const RL_KEY = 'track_last_search';
const HISTORY_KEY = 'track_search_history';
const MAX_HISTORY = 5;
let countdownTimer = null;

const STATUS_CONFIG = {
  'รอซ่อม':                 {icon:'⏳',label:'รอซ่อม',               badge:'bg-amber-100 text-amber-700',  step:1},
  'อยู่ระหว่างซ่อม':         {icon:'🔧',label:'กำลังซ่อม',            badge:'bg-blue-100 text-blue-700',    step:2},
  'ซ่อมเสร็จ':               {icon:'✅',label:'ซ่อมเสร็จแล้ว',        badge:'bg-emerald-100 text-emerald-700',step:3},
  'ซ่อมเสร็จ ส่งคืนลูกค้า':  {icon:'📦',label:'ส่งคืนลูกค้าแล้ว',     badge:'bg-emerald-100 text-emerald-700',step:4},
  'ยกเลิกซ่อม':             {icon:'❌',label:'ยกเลิกการซ่อม',        badge:'bg-red-100 text-red-700',      step:0},
  'ยกเลิกซ่อมส่งคืนลูกค้า': {icon:'📤',label:'ยกเลิกซ่อม ส่งคืนแล้ว', badge:'bg-orange-100 text-orange-700', step:0},
  'ยกเลิกซ่อม ส่งกลับแล้ว': {icon:'📤',label:'ยกเลิกซ่อม ส่งคืนแล้ว', badge:'bg-orange-100 text-orange-700', step:0},
};

const STEPS = [
  {label:'รับเครื่อง', icon:'📥'},
  {label:'กำลังซ่อม', icon:'🔧'},
  {label:'ซ่อมเสร็จ', icon:'✅'},
  {label:'ส่งคืนแล้ว',icon:'📦'},
];

function shake(){
  const el = document.getElementById('searchBox');
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
  el.addEventListener('animationend', ()=>el.classList.remove('shake'), {once:true});
}

function checkRateLimit(){
  const last = parseInt(localStorage.getItem(RL_KEY)||'0');
  const diff = Date.now() - last;
  if(diff < RATE_LIMIT_MS && last > 0){
    startCountdown(Math.ceil((RATE_LIMIT_MS - diff) / 1000));
    return true;
  }
  return false;
}

function startCountdown(seconds){
  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('searchInput');
  const box = document.getElementById('rateLimitBox');
  const secEl = document.getElementById('countdownSec');
  btn.disabled = true;
  input.disabled = true;
  box.classList.remove('hidden');
  secEl.textContent = seconds;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    seconds--;
    secEl.textContent = seconds;
    if(seconds <= 0){
      clearInterval(countdownTimer);
      btn.disabled = false;
      input.disabled = false;
      box.classList.add('hidden');
    }
  }, 1000);
}

function setLoading(isLoading){
  const btn = document.getElementById('searchBtn');
  const input = document.getElementById('searchInput');
  btn.disabled = isLoading;
  input.disabled = isLoading;
  document.getElementById('loadingArea').classList.toggle('hidden', !isLoading);
  btn.textContent = isLoading ? '⏳ กำลังค้นหา...' : '🔍 ค้นหา';
}

async function doSearch(){
  const raw = document.getElementById('searchInput').value.trim();
  const q = raw.replace(/\s/g,'');

  if(!q){
    showError('กรุณากรอกเบอร์โทรหรือรหัสงาน');
    shake(); return;
  }

  const isNumber = /^\d+$/.test(q);
  if(isNumber && q.length !== 10){
    showError('เบอร์โทรต้องเป็นตัวเลข 10 หลัก ไม่มีขีด ไม่มีเว้นวรรค\nเช่น 0812345678');
    shake(); return;
  }

  if(checkRateLimit()) return;

  document.getElementById('resultArea').innerHTML = '';
  setLoading(true);

  try {
    const res = await fetch(`${API_URL}?action=track&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    setLoading(false);
    localStorage.setItem(RL_KEY, Date.now().toString());
    startCountdown(Math.ceil(RATE_LIMIT_MS / 1000));
    saveHistory(q);

    if(!data.ok){
      showError(data.msg);
      return;
    }
    showResults(data.results);
  } catch (err) {
    setLoading(false);
    showError('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง');
  }
}

function showResults(results){
  document.getElementById('resultArea').innerHTML = results.map(r=>{
    const cfg = STATUS_CONFIG[r.status] || {icon:'❓',label:r.status,badge:'bg-gray-100 text-gray-600',step:-1};
    const step = cfg.step;
    const cancelled = r.status.includes('ยกเลิก');

    const stepsHtml = cancelled
      ? `<div class="flex items-center justify-center gap-2 py-2 ${r.status.includes('ส่ง')?'bg-orange-50':'bg-red-50'} rounded-xl">
          <span class="text-xl">${r.status.includes('ส่ง')?'📤':'❌'}</span>
          <span class="text-sm font-semibold ${r.status.includes('ส่ง')?'text-orange-600':'text-red-600'}">
            ${r.status.includes('ส่ง')?'ยกเลิกซ่อม — ส่งคืนเครื่องแล้ว':'ยกเลิกการซ่อม — กรุณาติดต่อร้านเพื่อรับเครื่องคืน'}
          </span>
        </div>`
      : `<div>
          <div class="relative flex justify-between" style="padding:0 4px">
            <div class="absolute flex gap-0" style="top:16px;left:14%;right:14%;z-index:0">
              ${[0,1,2].map(i=>`<div class="flex-1 h-1 ${i<step-1?'bg-cyan-400':'bg-gray-200'} ${i===0?'rounded-l-full':''}${i===2?'rounded-r-full':''}"></div>`).join('')}
            </div>
            ${STEPS.map((s,i)=>{
              const done = i < step-1;
              const active = i === step-1;
              const pending = i > step-1;
              return `<div class="flex flex-col items-center gap-1.5 relative" style="z-index:1;width:25%">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border-2
                  ${done ? 'bg-cyan-500 border-cyan-500 text-white'
                  : active ? 'bg-white border-cyan-500 text-cyan-600 shadow shadow-cyan-100'
                  : 'bg-white border-gray-200 text-gray-300'}">
                  ${done ? '✓' : active ? `<div class="w-2.5 h-2.5 rounded-full bg-cyan-500"></div>` : `<span style="font-size:10px">${i+1}</span>`}
                </div>
                <div class="text-center" style="font-size:10px;line-height:1.3;font-weight:${active?700:400};color:${done?'#0891B2':active?'#0369A1':'#D1D5DB'}">
                  ${s.label}
                </div>
              </div>`;
            }).join('')}
          </div>
          <div class="mt-3 py-2 px-3 rounded-xl text-center" style="background:#EFF6FF">
            <span class="text-xs font-bold" style="color:#1D4ED8">${cfg.icon} ${cfg.label}</span>
          </div>
        </div>`;

    return `<div class="bg-white border-2 border-gray-200 rounded-2xl p-5 mb-3 fade-in">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-xs text-gray-400">รหัสงาน</div>
          <div class="font-bold text-gray-800 text-xl font-mono">${r.jobId}</div>
        </div>
        <span class="text-xs font-bold px-3 py-1.5 rounded-full ${cfg.badge}">${cfg.icon} ${cfg.label}</span>
      </div>
      <div class="bg-gray-50 rounded-xl p-3 mb-4">${stepsHtml}</div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        ${r.brand||r.model?`<div class="col-span-2 bg-blue-50 rounded-xl px-3 py-2">
          <div class="text-xs text-gray-400">เครื่อง</div>
          <div class="font-semibold text-gray-700">${[r.brand,r.model].filter(Boolean).join(' ')}</div>
        </div>`:''}
        ${r.date?`<div class="bg-gray-50 rounded-xl px-3 py-2">
          <div class="text-xs text-gray-400">วันที่รับเครื่อง</div>
          <div class="font-semibold text-gray-700">${r.date}</div>
        </div>`:''}
        ${r.returnDate?`<div class="bg-emerald-50 rounded-xl px-3 py-2">
          <div class="text-xs text-gray-400">วันที่ส่งคืน</div>
          <div class="font-semibold text-emerald-600">${r.returnDate}</div>
        </div>`:''}
      </div>
    </div>`;
  }).join('');
}

function showError(msg){
  document.getElementById('resultArea').innerHTML = `
    <div class="bg-white border border-red-100 rounded-2xl p-6 text-center fade-in">
      <div class="text-4xl mb-3">😕</div>
      <div class="font-semibold text-gray-700 mb-1">ไม่พบข้อมูล</div>
      <div class="text-sm text-gray-400 whitespace-pre-line">${msg}</div>
    </div>`;
}

function getHistory(){
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); }
  catch(e){ return []; }
}

function saveHistory(query){
  let hist = getHistory().filter(h=>h !== query);
  hist.unshift(query);
  hist = hist.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
}

function renderHistory(items){
  const box = document.getElementById('historyBox');
  if(!items || items.length === 0){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = `<div class="text-xs text-gray-400 px-1 mb-1">🕐 ค้นหาล่าสุด</div>`
    + items.map(h=>`
      <div class="flex items-center justify-between bg-gray-50 hover:bg-blue-50 border border-gray-100 rounded-xl px-3 py-2 cursor-pointer transition-colors"
        onclick="selectHistory('${h}')">
        <span class="text-sm text-gray-700 font-mono">${h}</span>
        <button onclick="event.stopPropagation();removeHistory('${h}')"
          class="text-gray-300 hover:text-red-400 text-xs px-1 transition-colors">✕</button>
      </div>`).join('');
}

function filterHistory(val){
  const hist = getHistory();
  if(!val){ renderHistory(hist); return; }
  renderHistory(hist.filter(h=>h.toLowerCase().includes(val.toLowerCase())));
}

function selectHistory(val){
  document.getElementById('searchInput').value = val;
  document.getElementById('historyBox').classList.add('hidden');
  doSearch();
}

function removeHistory(val){
  const hist = getHistory().filter(h=>h !== val);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
  filterHistory(document.getElementById('searchInput').value);
}

document.addEventListener('DOMContentLoaded', ()=>{
  checkRateLimit();
  const input = document.getElementById('searchInput');
  const params = new URLSearchParams(window.location.search);
  const jobFromUrl = params.get('job') || params.get('q');
  if(jobFromUrl){
    input.value = jobFromUrl.trim();
    setTimeout(doSearch, 400);
  }
  input.addEventListener('focus', ()=>filterHistory(input.value));
  document.addEventListener('click', e=>{
    if(!e.target.closest('#searchBox'))
      document.getElementById('historyBox').classList.add('hidden');
  });
  const hist = getHistory();
  if(hist.length > 0) renderHistory(hist);
});
</script>
</body>
</html>
